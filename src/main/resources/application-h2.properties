# Configuración para usar H2 en modo PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Opcional: Habilitar consola web
spring.h2.console.enabled=true
spring.h2.console.path=/my-console
spring.h2.console.settings.web-allow-others=false

# Clave de desarrollo exclusiva para H2; producción debe configurar JWT_SECRET_KEY.
application.security.jwt.secret-key=${JWT_SECRET_KEY:VEhJU19JU19OT1RfQV9QUk9EVUNUSU9OX0pXVF9TRUNSRVRfS0VZXzMyX0JZVEVT}
security.auth-cookie-secure=${AUTH_COOKIE_SECURE:false}
security.registration.enabled=${AUTH_REGISTRATION_ENABLED:true}

spring.sql.init.platform=h2
